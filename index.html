<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I am going to DDX</title>
<meta name="description" content="Coming to DDX? Make your &ldquo;I am going&rdquo; post for San Diego, Miami, London, Dubai, Tokyo, Munich or New York and let your network know.">
<meta property="og:type" content="website">
<meta property="og:title" content="I am going to DDX">
<meta property="og:description" content="Make your &ldquo;I am going&rdquo; post and let your network know which DDX you're joining.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:url" content="https://share.ddxconference.com/">
<meta property="og:image" content="https://share.ddxconference.com/assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://share.ddxconference.com/assets/img/og-image.png">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=1">
</head>
<body>
<main class="layout">

  <header class="brand">
      <img src="assets/img/ddx-wordmark.png" alt="DDX" class="brand-mark">
  </header>


  <section class="preview">
    <p class="preview-label">Preview</p>
    <div class="badge-card">
      <canvas id="previewCanvas" width="1080" height="1350"></canvas>
      <div class="card-overlay" id="cardOverlay" aria-hidden="true">
        <button type="button" class="card-cta" data-act="upload" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 20h16"/></svg>
          Upload Photo
        </button>
        <button type="button" class="card-cta" data-act="camera" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          Use Camera
        </button>
        <p class="card-hint">or just drop one here :)</p>
      </div>
    </div>
  </section>

  <div class="dock" id="dock">
    <button class="dock__edit" id="sheetOpen" type="button" aria-controls="sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg>
      <span>Edit your poster</span>
    </button>
    <button class="dock__save" id="dockSave" type="button">
      <svg id="dockSaveIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 21h16"/></svg>
      <svg id="dockShareIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M20 14v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5"/></svg>
      <span id="dockSaveLabel">Download PNG</span>
    </button>
  </div>

  <div class="sheet" id="sheet">
    <button class="sheet__grab" id="sheetGrab" type="button" aria-expanded="true" aria-controls="sheet">
      <i></i><span>Hide options</span>
    </button>

  <section class="panel">
    <h1 class="sr-only">Make your DDX &ldquo;I am going&rdquo; post</h1>

    <div class="field">
      <span id="editionLabel">Edition</span>
      <select id="editionInput" autocomplete="off"></select>
      <p class="edition-hint">Pick your edition to start.</p>
    </div>

    <div class="field needs-edition">
      <span>Format</span>
      <div class="segmented" role="radiogroup" aria-label="Format">
        <label class="seg">
          <input type="radio" name="mode" value="image" checked>
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m4 17 5-5 4 4 3-2 4 4"/></svg>
            Image
          </span>
        </label>
        <label class="seg">
          <input type="radio" name="mode" value="video">
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="m22 8-6 4 6 4V8z"/></svg>
            Video
          </span>
        </label>
      </div>
    </div>

    <div class="field needs-edition" id="bgField" hidden>
      <span>Background</span>
      <div class="thumbs" id="bgThumbs" role="radiogroup" aria-label="Background image"></div>
    </div>

    <div class="field needs-edition">
      <span>Headline</span>
      <div class="chips" role="radiogroup" aria-label="Headline">
        <label class="chip"><input type="radio" name="headline" value="I AM GOING" checked><span>I am going</span></label>
        <label class="chip"><input type="radio" name="headline" value="SEE YOU AT"><span>See you at</span></label>
        <label class="chip"><input type="radio" name="headline" value="MEET ME AT"><span>Meet me at</span></label>
        <label class="chip chip--icon" title="No headline"><input type="radio" name="headline" value="" aria-label="No headline"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M6.61 6.61A18.4 18.4 0 0 0 2 12s3 8 10 8a9.7 9.7 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/></svg></span></label>
      </div>
    </div>

    <div class="field photo-field needs-edition">
      <span>Your photo</span>

      <div class="photo-row">
        <img id="photoThumb" alt="Your photo" hidden>
        <button id="uploadBtn" class="photo-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 20h16"/></svg>
          <span>Upload Photo</span>
        </button>
        <button id="webcamBtn" class="photo-btn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          <span>Use Camera</span>
        </button>
        <input id="fileInput" type="file" accept="image/*" hidden>
        <input id="cameraInput" type="file" accept="image/*" capture="user" hidden>
      </div>

      <div class="upload-bar" id="uploadBar" hidden>
        <div class="upload-bar__track"><i id="uploadBarFill"></i></div>
        <span id="uploadBarLabel">Reading photo…</span>
      </div>

      <div class="sliders">
        <label class="slider">
          <em>Zoom</em>
          <input id="zoomInput" type="range" min="1" max="2.5" step="0.05" value="1">
        </label>
        <label class="slider">
          <em>Position</em>
          <input id="panInput" type="range" min="-1" max="1" step="0.02" value="-0.25">
        </label>
      </div>
    </div>

    <label class="field needs-edition">
      <span>Name</span>
      <input id="nameInput" type="text" placeholder="Your name" maxlength="40" autocomplete="off">
    </label>

    <label class="field needs-edition">
      <span>Role &amp; company</span>
      <input id="roleInput" type="text" placeholder="Optional" maxlength="60" autocomplete="off">
    </label>
  </section>

  <section class="actions-area">
    <!-- Only a box on desktop, where the bar runs full-bleed and its contents
         have to line up with the columns above. `display:contents` on phones. -->
    <div class="actions-bar">
      <div class="actions needs-edition" data-for="image">
        <button id="pngBtn" class="cta" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 21h16"/></svg>
          Download PNG
        </button>
        <button id="shareBtnImage" class="cta cta--ghost" type="button" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M20 14v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5"/></svg>
          Share
        </button>
      </div>
      <div class="actions needs-edition" data-for="video" hidden>
        <button id="mp4Btn" class="cta" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 21h16"/></svg>
          MP4
        </button>
        <button id="shareBtn" class="cta cta--ghost" type="button" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M20 14v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5"/></svg>
          Share
        </button>
        <button id="gifBtn" class="cta cta--ghost" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 21h16"/></svg>
          GIF
        </button>
      </div>
      <p id="exportStatus" class="status" hidden></p>
      <p class="ticket-line">Not registered yet? <a href="https://www.ddxconference.com" target="_blank" rel="noopener">Get your DDX ticket &rarr;</a></p>
  </div>
  </section>
  </div>

</main>

<dialog id="webcamDialog">
  <div class="cam-wrap">
    <video id="camVideo" autoplay playsinline muted></video>
    <div class="cam-frame"></div>
  </div>
  <div class="cam-actions">
    <button id="camCancel" class="photo-btn" type="button">Cancel</button>
    <button id="camShoot" class="cta" type="button">Take Photo</button>
  </div>
</dialog>

<script type="module" src="assets/js/main.js?v=1"></script>
</body>
</html>
